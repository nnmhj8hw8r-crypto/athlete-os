<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гладиатор: шахматки</title>
<meta name="description" content="Офлайн-приложение для составления шахматок внутриклубных соревнований по самбо">
<style>
/* Рабочий инструмент секретаря: шапка с эмблемой и контролем, вкладки по шагам турнира, карточки сеток.
   Фирменный бордовый и бежевый — из эмблемы клуба, только как акценты; красный и синий — пол и
   предупреждения; печатный бланк всегда чёрно-белый. */
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --fg: #1b1f2a;
  --muted: #5d6475;
  --line: #d9dce4;
  --red: #c62832;
  --red-soft: #fbe9ea;
  --blue: #1f4fbf;
  --blue-soft: #e8eefb;
  --ok: #1d7a46;
  --ok-soft: #e4f4ea;
  --warn: #9a5b00;
  --warn-soft: #fdf1dc;
  --font: "Segoe UI", "PT Sans", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, "Roboto Mono", monospace;
  --brand: #8e1b2e;
  --brand-ink: #ffffff;
  --beige: #b4a683;
  --beige-soft: #f3efe5;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1b2029; --fg: #e8eaf0; --muted: #9aa1b2; --line: #2d3442;
    --red: #ff6b73; --red-soft: #3a1c20; --blue: #7ea2ff; --blue-soft: #1b2645;
    --ok: #5fd08f; --ok-soft: #173326; --warn: #f2b45a; --warn-soft: #3a2c14;
    --brand: #c43a50; --beige: #c9bb97; --beige-soft: #2a261d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1b2029; --fg: #e8eaf0; --muted: #9aa1b2; --line: #2d3442;
  --red: #ff6b73; --red-soft: #3a1c20; --blue: #7ea2ff; --blue-soft: #1b2645;
  --ok: #5fd08f; --ok-soft: #173326; --warn: #f2b45a; --warn-soft: #3a2c14;
  --brand: #c43a50; --beige: #c9bb97; --beige-soft: #2a261d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Шапка */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top .wrap { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; margin-right: auto; }
.brand .logo { width: 40px; height: 40px; border-radius: 8px; background: #000; flex: none; }
.demo-tag { display: inline-block; vertical-align: 2px; margin-left: 6px; padding: 1px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; background: var(--beige-soft); color: var(--fg); border: 1px solid var(--beige); }
.brand small { font-weight: 400; color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; background: var(--surface); cursor: default; white-space: nowrap; font-variant-numeric: tabular-nums; }
button.chip { cursor: pointer; }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.bad { background: var(--red-soft); border-color: transparent; color: var(--red); font-weight: 600; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }

nav.tabs { display: flex; gap: 2px; overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 10px 14px; border-bottom: 3px solid transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-current="page"] { color: var(--fg); border-bottom-color: var(--brand); font-weight: 600; }
nav.tabs button .n { font-size: 12px; color: var(--muted); margin-left: 4px; }

main { padding-block: 18px 60px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
h2 { font-size: 20px; margin: 0; text-wrap: balance; }
h3 { font-size: 16px; margin: 0; }
p { margin: 0; }
.hint { color: var(--muted); font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.spacer { flex: 1; }

/* Кнопки и поля */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--red); }
.btn.small { padding: 3px 8px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
input:focus, select:focus, textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
.f { display: grid; gap: 3px; font-size: 13px; color: var(--muted); min-width: 0; }
.f > span { overflow-wrap: anywhere; }
input, select, textarea { border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--surface); min-width: 0; }
input[type="number"] { font-variant-numeric: tabular-nums; }
textarea { resize: vertical; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }

/* «от 3 до 5» — одна настройка в одной строке */
.range { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--fg); font-size: 14px; }
.range input { width: 64px; }

/* Сворачиваемые пояснения */
details.help { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
details.help > summary { cursor: pointer; padding: 8px 12px; font-size: 14px; color: var(--muted); list-style-position: inside; }
details.help[open] > summary { border-bottom: 1px solid var(--line); color: var(--fg); }
details.help > :not(summary) { margin: 10px 12px; }
details.help p { font-size: 13px; color: var(--muted); max-width: 90ch; }
details.help textarea { width: calc(100% - 24px); }
.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }

/* Подсказки из справочника под полем «Фамилия» */
.ac { position: relative; }
.ac-list { position: absolute; top: 100%; left: 0; z-index: 20; margin-top: 4px; min-width: max(100%, 320px); max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.16); overflow: hidden; color: var(--fg); }
.ac-item { padding: 7px 10px; cursor: pointer; font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ac-item span { color: var(--muted); font-size: 13px; }
.ac-item.on, .ac-item:hover { background: var(--beige-soft); }
.ac-foot { padding: 5px 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.part-hint { font-size: 14px; color: var(--muted); }
.part-hint b { color: var(--fg); }
.part-hint .bad { color: var(--red); }

/* Форма взвешивания */
.weigh-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.weigh-form .wide { grid-column: span 2; }
.err { color: var(--red); font-size: 13px; }

/* Таблицы */
.table-wrap { overflow-x: auto; }
table.list { border-collapse: collapse; width: 100%; font-size: 14px; }
table.list th, table.list td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.list th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
table.list td.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.withdrawn td { color: var(--muted); text-decoration: line-through; }
tr.withdrawn td:last-child { text-decoration: none; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 12px; background: var(--bg); border: 1px solid var(--line); }
.tag.test { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.tag.m { color: var(--blue); }
.tag.f { color: var(--red); }

/* Части и сетки */
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.subtabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.subtabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: grid; min-width: 0; }
.card.warn { border-color: var(--warn); }
.card.bad { border-color: var(--red); }
.card header { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.card header .lbl { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.card header .meta { color: var(--muted); font-size: 13px; }
.card .body { padding: 8px 12px 12px; display: grid; gap: 8px; }
.card table { width: 100%; border-collapse: collapse; font-size: 14px; }
.card td { padding: 4px 2px; border-bottom: 1px dashed var(--line); }
.card td.no { width: 22px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card td.w { text-align: right; font-variant-numeric: tabular-nums; width: 56px; }
.card td.act { width: 1%; white-space: nowrap; text-align: right; }
.card td.act select { padding: 2px 4px; font-size: 12px; max-width: 120px; }
.card .foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.card .foot input.lab { width: 70px; padding: 2px 6px; }
.card .foot select { padding: 2px 6px; }
.notice { padding: 8px 10px; border-radius: 6px; font-size: 13px; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--red-soft); color: var(--red); }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.notice.info { background: var(--blue-soft); color: var(--blue); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

/* Ковры */
.mats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.mat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; align-content: start; }
.mat h3 { display: flex; justify-content: space-between; align-items: baseline; }
.mat h3 .load { font-size: 13px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.mat .item { display: flex; gap: 8px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 14px; }
.mat .item select { padding: 1px 4px; font-size: 12px; }
.bar { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blue); }

/* Настройки */
.parts-table input { width: 100%; }
.parts-table td { padding: 4px; }
.parts-table input.y { width: 74px; }
.parts-table input.kg { width: 70px; }

/* Окно подтверждения и уведомления */
.modal-back { position: fixed; inset: 0; background: rgba(10, 12, 18, .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 10px; max-width: 520px; width: 100%; padding: 18px; display: grid; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal textarea { width: 100%; min-height: 160px; font: 12px var(--mono); }
.modal .row { justify-content: flex-end; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 60; max-width: calc(100% - 32px); font-size: 14px; }
.banner { background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.banner .wrap { padding-block: 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* Предпросмотр бланков на экране */
.sheets { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; justify-items: center; }
.sheet-frame { background: #fff; color: #000; box-shadow: 0 1px 6px rgba(0,0,0,.18); width: 210mm; max-width: 100%; overflow-x: auto; }
.print-list label { display: flex; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }

/* Бланк шахматки — по образцу клуба */
.sheet { width: 210mm; min-height: 140mm; padding: 12mm 14mm; font-family: Arial, "Liberation Sans", Helvetica, sans-serif; color: #000; background: #fff; position: relative; }
.sheet .mat-no { position: absolute; top: 9mm; right: 14mm; font: 700 22pt "Times New Roman", serif; border-bottom: 1.5pt solid #000; line-height: 1; padding: 0 2mm 1mm; }
.sheet h1 { text-align: center; font-size: 15pt; margin: 0 0 2mm; font-weight: 700; }
.sheet .line { display: flex; justify-content: space-between; font-size: 12pt; font-weight: 700; padding: 0 12mm 0 18mm; }
.sheet table.chess { border-collapse: collapse; width: 100%; margin-top: 1mm; font-size: 10.5pt; }
.sheet table.chess th, .sheet table.chess td { border: 1pt solid #000; height: 7mm; padding: 0 2mm; }
.sheet table.chess th { font-weight: 700; text-align: center; }
.sheet table.chess td.no { text-align: center; width: 9mm; font-weight: 700; }
.sheet table.chess td.fio { width: 55mm; }
.sheet table.chess td.x { background: #000; }
.sheet table.chess td.c { width: 15mm; }
.sheet .rounds { margin-top: 3mm; display: grid; gap: 1mm; }
.sheet .rt { text-align: center; font-weight: 700; font-size: 12pt; }
.sheet .pair { display: grid; grid-template-columns: 1fr 1fr; column-gap: 26mm; font-size: 12pt; padding: 0 4mm; }
.sheet .pair span { border-bottom: 1pt solid #000; padding: 0 1mm; min-height: 6mm; display: flex; align-items: end; }
.sheet .pair span:last-child { margin-left: 18mm; }

#print-area { display: none; }

@media (max-width: 640px) {
  .top { position: static; }
  .weigh-form .wide { grid-column: auto; }
  .grid-cards { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

@media print {
  @page { size: A4 portrait; margin: 0; }
  body { background: #fff !important; }
  body > *:not(#print-area) { display: none !important; }
  #print-area { display: block !important; }
  #print-area .sheet { page-break-after: always; break-after: page; }
  #print-area .sheet:last-child { page-break-after: auto; break-after: auto; }
}

/* Заявка: статусы, сводка, строка «приехали N из M» на взвешивании */
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.arrived { background: var(--ok-soft); color: var(--ok); }
.pill.expected { background: var(--warn-soft); color: var(--warn); }
.pill.absent { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
tr.st-absent td:not(:last-child) { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.stats > div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; display: grid; }
.stats b { font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stats span { font-size: 12px; color: var(--muted); }
.stats .ok b { color: var(--ok); }
.stats .warn b { color: var(--warn); }
.arrivals { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 14px; padding: 8px 12px; border-radius: 6px; background: var(--beige-soft); }
.arrivals .ok { color: var(--ok); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--brand); text-decoration: underline; cursor: pointer; font: inherit; }
.ac-item em.st { font-style: normal; font-size: 11px; margin-left: auto; padding: 1px 7px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.ac-item em.st.entry { background: var(--beige-soft); color: var(--fg); border-color: var(--beige); }
.ac-item em.st.arrived { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.ac-item em.st.absent { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.err:empty { display: none; }

/* Телефон и планшет: компактная шапка, кнопки крупнее для пальца */
@media (pointer: coarse) {
  .btn, .btn.small { min-height: 36px; }
  .kbd-only { display: none; }
}
@media (max-width: 640px) {
  .banner-text { display: none; }
  .top .wrap { gap: 8px; }
  .chips .chip { font-size: 12px; padding: 2px 8px; }
  .actions .btn { padding: 5px 9px; font-size: 14px; }
  .brand { font-size: 16px; }
  main { padding-block: 12px 48px; gap: 12px; }
  .panel { padding: 12px; }
}
</style>
</head>
<body>
<div id="app"><noscript>Для работы приложения включите JavaScript.</noscript></div>
<div id="print-area"></div>
<script>
// Гладиатор: шахматки — чистая логика без интерфейса.
// Подключается обычным <script> (создаёт globalThis.GL) и импортируется в тестах Node.
(function () {
  'use strict';

  const SCHEMA_VERSION = 3;
  // «Цена» каждой лишней сетки в разбивке (в кг² разброса веса): чем больше, тем реже сетки по 3.
  const GRID_COST = 1;
  const LETTERS = ['а', 'б', 'в', 'г', 'д', 'е', 'ж', 'з', 'и', 'к', 'л', 'м'];
  const MONTHS = [
    'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
    'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря',
  ];

  let idCounter = 0;
  function uid(prefix) {
    idCounter += 1;
    return (prefix || 'id') + '-' + Date.now().toString(36) + '-' + idCounter.toString(36) +
      Math.random().toString(36).slice(2, 6);
  }

  function defaultState() {
    return {
      schema: SCHEMA_VERSION,
      settings: {
        title: 'Первенство спортивного клуба Гладиатор',
        date: '',
        minSize: 3,
        maxSize: 5,
        mats: 3,
        levels: ['Новичок', 'Средний', 'Опытный'],
        formats: ['На коленках', 'В стойке'],
        branches: [],
        coaches: [],
        parts: [
          { id: 'p1', name: 'Часть 1', yearFrom: 2020, yearTo: 2022, format: 'На коленках', weightMode: 'float', limits: [], maxDiffKg: null },
          { id: 'p2', name: 'Часть 2', yearFrom: 2017, yearTo: 2019, format: 'В стойке', weightMode: 'float', limits: [], maxDiffKg: null },
          { id: 'p3', name: 'Часть 3', yearFrom: 2014, yearTo: 2016, format: 'В стойке', weightMode: 'float', limits: [], maxDiffKg: null },
          { id: 'p4', name: 'Часть 4', yearFrom: null, yearTo: null, format: 'В стойке', weightMode: 'float', limits: [], maxDiffKg: null },
        ],
      },
      participants: [],
      grids: [],
      builtParts: {},
      roster: [],
      entries: [],
    };
  }

  // Проверка значений из файла: всё, что не проходит, отбрасывается, а не отображается как есть.
  const ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  function cleanStr(v, max) {
    return typeof v === 'string' ? v.trim().slice(0, max || 100) : '';
  }
  function cleanId(v) {
    return typeof v === 'string' && ID_RE.test(v) ? v : null;
  }
  function cleanDate(v) {
    if (typeof v !== 'string' || !DATE_RE.test(v)) return null;
    const d = new Date(v + 'T00:00:00Z');
    return !isNaN(d) && d.toISOString().slice(0, 10) === v ? v : null;
  }
  // Вес — число от 5 до 150 кг; строки вида «24,5» принимаются, всё остальное — нет.
  function cleanWeight(v) {
    let w = NaN;
    if (typeof v === 'number') w = v;
    else if (typeof v === 'string' && /^\s*\d{1,3}([.,]\d{1,2})?\s*$/.test(v)) w = parseFloat(v.replace(',', '.'));
    return Number.isFinite(w) && w >= 5 && w <= 150 ? Math.round(w * 10) / 10 : null;
  }
  function cleanSex(v) {
    return typeof v === 'string' && /^(ж|д|f)/i.test(v.trim()) ? 'Ж' : 'М';
  }
  function cleanInt(v, min, max, def) {
    const n = Number(v);
    return Number.isInteger(n) && n >= min && n <= max ? n : def;
  }
  function cleanList(v, max) {
    return Array.isArray(v) ? v.map((x) => cleanStr(x, max)).filter(Boolean) : null;
  }

  function cleanPart(r) {
    if (!r || typeof r !== 'object') return null;
    const id = cleanId(r.id);
    if (!id) return null;
    const from = cleanInt(r.yearFrom, 1990, 2035, null);
    const to = cleanInt(r.yearTo, 1990, 2035, null);
    const limits = Array.isArray(r.limits) ? r.limits.map(Number).filter((x) => Number.isFinite(x) && x > 0 && x <= 150).sort((a, b) => a - b) : [];
    const diff = Number(r.maxDiffKg);
    return {
      id, name: cleanStr(r.name, 60) || 'Часть',
      yearFrom: from, yearTo: to,
      format: cleanStr(r.format, 60),
      weightMode: r.weightMode === 'fixed' ? 'fixed' : 'float',
      limits, maxDiffKg: Number.isFinite(diff) && diff > 0 && diff <= 50 ? diff : null,
    };
  }

  function cleanParticipant(r) {
    if (!r || typeof r !== 'object') return null;
    const id = cleanId(r.id);
    const lastName = cleanStr(r.lastName, 60);
    const birthDate = cleanDate(r.birthDate);
    const weight = cleanWeight(r.weight);
    if (!id || !lastName || !birthDate || weight == null) return null;
    return {
      id, lastName, firstName: cleanStr(r.firstName, 60), birthDate, sex: cleanSex(r.sex), weight,
      level: cleanStr(r.level), branch: cleanStr(r.branch), coach: cleanStr(r.coach),
      withdrawn: r.withdrawn === true, test: r.test === true,
      partId: cleanId(r.partId) || '', entryId: cleanId(r.entryId) || '',
      addedAt: cleanStr(r.addedAt, 40),
    };
  }

  // Строки заявки и справочника: как участник, но без веса (вес появится при взвешивании).
  function cleanPerson(r) {
    if (!r || typeof r !== 'object') return null;
    const id = cleanId(r.id);
    const lastName = cleanStr(r.lastName, 60);
    const birthDate = cleanDate(r.birthDate);
    if (!id || !lastName || !birthDate) return null;
    return {
      id, lastName, firstName: cleanStr(r.firstName, 60), birthDate, sex: cleanSex(r.sex),
      level: cleanStr(r.level), branch: cleanStr(r.branch), coach: cleanStr(r.coach),
      partId: cleanId(r.partId) || '', absent: r.absent === true, test: r.test === true,
    };
  }

  function cleanRoster(r) {
    const c = cleanPerson(r);
    if (c) { delete c.absent; delete c.partId; }
    return c;
  }

  function cleanGrid(g, participantIds, partIds, report) {
    if (!g || typeof g !== 'object') return null;
    const id = cleanId(g.id);
    const partId = cleanId(g.partId);
    if (!id || !partIds.has(partId)) return null;
    const raw = Array.isArray(g.members) ? g.members : [];
    const members = raw.map(cleanId).filter((m) => m && participantIds.has(m));
    report.refs += raw.length - members.length;
    if (!members.length) return null;
    const printed = typeof g.printedAt === 'string' ? cleanStr(g.printedAt, 40) : '';
    return {
      id, partId, sex: cleanSex(g.sex), level: cleanStr(g.level), format: cleanStr(g.format, 60),
      members: Array.from(new Set(members)),
      mat: cleanInt(g.mat, 1, 10, null), matManual: g.matManual === true,
      locked: g.locked === true, printedAt: printed || null, dirtyAfterPrint: g.dirtyAfterPrint === true,
      labelOverride: cleanStr(g.labelOverride, 20),
    };
  }

  // Общий разбор списка записей: битые и повторные (по id) записи отбрасываются и считаются.
  function keepValid(list, clean, report) {
    const seen = new Set();
    const out = [];
    for (const r of Array.isArray(list) ? list : []) {
      const c = clean(r);
      if (!c || seen.has(c.id)) { report.dropped += 1; continue; }
      seen.add(c.id);
      out.push(c);
    }
    return out;
  }

  function cleanSettings(s, report) {
    const base = defaultState().settings;
    if (!s || typeof s !== 'object') return base;
    const parts = keepValid(s.parts, cleanPart, report);
    const min = cleanInt(s.minSize, 2, 8, base.minSize);
    const max = cleanInt(s.maxSize, 2, 8, base.maxSize);
    return {
      title: cleanStr(s.title, 200) || base.title,
      date: cleanDate(s.date) || '',
      minSize: min <= max ? min : base.minSize,
      maxSize: min <= max ? max : base.maxSize,
      mats: cleanInt(s.mats, 1, 10, base.mats),
      levels: cleanList(s.levels, 60) || base.levels,
      formats: cleanList(s.formats, 60) || base.formats,
      branches: cleanList(s.branches, 60) || [],
      coaches: cleanList(s.coaches, 60) || [],
      parts: parts.length ? parts : base.parts,
    };
  }

  // Старые файлы турнира приводим к текущему формату; каждая запись проверяется.
  // Возвращает состояние и отчёт: сколько записей отброшено и сколько ссылок на участников убрано.
  function migrateWithReport(data) {
    if (!data || typeof data !== 'object') throw new Error('Файл не похож на турнир');
    if (!Array.isArray(data.participants) || !data.settings) throw new Error('В файле нет списка участников или настроек');
    if ((data.schema || 0) > SCHEMA_VERSION) throw new Error('Файл создан более новой версией приложения');
    const report = { dropped: 0, refs: 0 };
    const settings = cleanSettings(data.settings, report);
    const partIds = new Set(settings.parts.map((p) => p.id));
    const participants = keepValid(data.participants, cleanParticipant, report);
    const participantIds = new Set(participants.map((p) => p.id));
    const entries = keepValid(data.entries, cleanPerson, report);
    const entryIds = new Set(entries.map((e) => e.id));
    for (const p of participants) if (p.entryId && !entryIds.has(p.entryId)) p.entryId = '';
    const grids = [];
    const gridIds = new Set();
    for (const g of Array.isArray(data.grids) ? data.grids : []) {
      const c = cleanGrid(g, participantIds, partIds, report);
      if (!c || gridIds.has(c.id)) { report.dropped += 1; continue; }
      gridIds.add(c.id);
      grids.push(c);
    }
    const builtParts = {};
    if (data.builtParts && typeof data.builtParts === 'object') {
      for (const k of Object.keys(data.builtParts)) if (partIds.has(k) && data.builtParts[k] === true) builtParts[k] = true;
    }
    const state = {
      schema: SCHEMA_VERSION,
      settings,
      participants,
      grids,
      builtParts,
      roster: keepValid(data.roster, cleanRoster, report),
      entries,
    };
    // Версия 1: три формата по умолчанию → два («На коленках», «В стойке»).
    if ((data.schema || 1) < 2 && JSON.stringify(state.settings.formats) === JSON.stringify(['На коленках без курток', 'На коленках', 'В стойке'])) {
      const used = state.settings.parts.some((p) => p.format === 'На коленках без курток') || state.grids.some((g) => g.format === 'На коленках без курток');
      if (!used) state.settings.formats = defaultState().settings.formats.slice();
    }
    return { state, report };
  }

  function migrate(data) {
    return migrateWithReport(data).state;
  }

  function clone(state) {
    return JSON.parse(JSON.stringify(state));
  }

  // ---------- Даты и подписи ----------

  function birthYear(p) {
    const y = parseInt(String(p.birthDate || '').slice(0, 4), 10);
    return Number.isFinite(y) ? y : null;
  }

  function formatRuDate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!m) return '«___» __________ 20__ г.';
    return '«' + parseInt(m[3], 10) + '» ' + MONTHS[parseInt(m[2], 10) - 1] + ' ' + m[1] + ' г.';
  }

  function formatBirth(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? m[3] + '.' + m[2] + '.' + m[1] : '';
  }

  function toRoman(n) {
    const map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
    let out = '';
    let x = n;
    for (const [v, s] of map) while (x >= v) { out += s; x -= v; }
    return out;
  }

  function fullName(p) {
    return (p.lastName + ' ' + p.firstName).trim();
  }

  function partYearsLabel(part) {
    if (part.yearFrom && part.yearTo) {
      const a = Math.min(part.yearFrom, part.yearTo);
      const b = Math.max(part.yearFrom, part.yearTo);
      return a === b ? String(a) : a + '-' + b;
    }
    return '';
  }

  // ---------- Части и группы ----------

  function partInRange(part, year) {
    if (!part.yearFrom || !part.yearTo || year == null) return false;
    const a = Math.min(part.yearFrom, part.yearTo);
    const b = Math.max(part.yearFrom, part.yearTo);
    return year >= a && year <= b;
  }

  // Участник может быть вручную закреплён за частью (p.partId), иначе — по году рождения.
  function partOf(state, p) {
    if (p.partId && state.settings.parts.some((x) => x.id === p.partId)) return p.partId;
    const y = birthYear(p);
    const part = state.settings.parts.find((x) => partInRange(x, y));
    return part ? part.id : null;
  }

  function getPart(state, partId) {
    return state.settings.parts.find((x) => x.id === partId) || null;
  }

  function activeOfPart(state, partId) {
    return state.participants.filter((p) => !p.withdrawn && partOf(state, p) === partId);
  }

  function sortedLimits(part) {
    return (part.limits || []).map(Number).filter((x) => x > 0).sort((a, b) => a - b);
  }

  // Граница фиксированной категории: наименьшая «до X», куда помещается вес; тяжелее всех — «св. последней».
  function fixedLimit(part, weight) {
    const limits = sortedLimits(part);
    if (!limits.length) return null;
    for (const l of limits) if (weight <= l) return l;
    return -limits[limits.length - 1];
  }

  function groupKey(part, p) {
    const parts = [p.sex, p.level || ''];
    if (part.weightMode === 'fixed' && sortedLimits(part).length) parts.push(String(fixedLimit(part, p.weight)));
    return parts.join('|');
  }

  // ---------- Разбивка по весу ----------

  // Делим отсортированный по весу список на подряд идущие сетки размером min..max так,
  // чтобы разброс веса внутри сеток был минимальным (динамическое программирование).
  function partitionByWeight(items, min, max, maxDiffKg) {
    const n = items.length;
    if (n === 0) return [];
    if (n < min) return [items.slice()];
    const w = items.map((x) => x.weight);
    const INF = Number.POSITIVE_INFINITY;
    const dp = new Array(n + 1).fill(INF);
    const cut = new Array(n + 1).fill(-1);
    dp[0] = 0;
    for (let i = min; i <= n; i += 1) {
      for (let k = min; k <= max && k <= i; k += 1) {
        const j = i - k;
        if (dp[j] === INF) continue;
        const range = w[i - 1] - w[j];
        let cost = range * range;
        if (maxDiffKg && range > maxDiffKg) cost += 1000 + (range - maxDiffKg) * 100;
        cost += GRID_COST + Math.abs(k - 4) * 0.01; // меньше лишних сеток; при равенстве — ближе к 4
        if (dp[j] + cost < dp[i]) { dp[i] = dp[j] + cost; cut[i] = j; }
      }
    }
    if (dp[n] === INF) return [items.slice()];
    const chunks = [];
    let i = n;
    while (i > 0) { const j = cut[i]; chunks.unshift(items.slice(j, i)); i = j; }
    return chunks;
  }

  function byWeight(a, b) {
    return a.weight - b.weight || fullName(a).localeCompare(fullName(b), 'ru');
  }

  function makeGrid(partId, part, members) {
    const first = members[0];
    return {
      id: uid('g'),
      partId,
      sex: first ? first.sex : 'М',
      level: first ? first.level || '' : '',
      format: part.format || '',
      members: members.map((m) => m.id),
      mat: null,
      matManual: false,
      locked: false,
      printedAt: null,
      dirtyAfterPrint: false,
      labelOverride: '',
    };
  }

  // Группа меньше минимума сетки (например, 2 девочки-новичка) объединяется с ближайшим
  // уровнем того же пола (и той же весовой категории) — без «хвостов» из 1–2 человек.
  function mergeSmallGroups(state, part, groups) {
    const levels = state.settings.levels;
    const min = state.settings.minSize;
    const fixed = part.weightMode === 'fixed' && sortedLimits(part).length;
    const info = (g) => ({ sex: g[0].sex, lvl: levels.indexOf(g[0].level), cat: fixed ? fixedLimit(part, g[0].weight) : null, w: avg(g.map((p) => p.weight)) });
    const list = groups.slice();
    const keep = new Set();
    for (;;) {
      const i = list.findIndex((g) => g.length < min && !keep.has(g));
      if (i < 0) break;
      const a = info(list[i]);
      let best = -1;
      let bestScore = Number.POSITIVE_INFINITY;
      list.forEach((g, j) => {
        if (j === i) return;
        const b = info(g);
        if (b.sex !== a.sex || b.cat !== a.cat) return;
        const score = Math.abs(b.lvl - a.lvl) * 1000 + Math.abs(b.w - a.w);
        if (score < bestScore) { bestScore = score; best = j; }
      });
      if (best < 0) { keep.add(list[i]); continue; }
      list[best] = list[best].concat(list[i]);
      list.splice(i, 1);
    }
    return list;
  }

  // Порядок сеток: мальчики, девочки; уровни как в настройках; по возрастанию веса.
  function sortGrids(state, grids) {
    const pm = participantsMap(state);
    const levels = state.settings.levels;
    const minW = (g) => Math.min.apply(null, gridWeights(state, g, pm).concat(Infinity));
    return grids.slice().sort((a, b) =>
      (a.sex === b.sex ? 0 : a.sex === 'Ж' ? 1 : -1) ||
      (levels.indexOf(a.level) - levels.indexOf(b.level)) ||
      (minW(a) - minW(b)));
  }

  function gridsOfPart(state, partId) {
    return state.grids.filter((g) => g.partId === partId);
  }

  // Собрать сетки части заново. Закреплённые сетки не трогаем.
  function buildPart(state, partId) {
    const part = getPart(state, partId);
    if (!part) return state;
    const s = state.settings;
    const locked = gridsOfPart(state, partId).filter((g) => g.locked);
    const inLocked = new Set(locked.flatMap((g) => g.members));
    const pool = activeOfPart(state, partId).filter((p) => !inLocked.has(p.id));
    const groups = new Map();
    for (const p of pool) {
      const key = groupKey(part, p);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    }
    const created = [];
    for (const list of mergeSmallGroups(state, part, Array.from(groups.values()))) {
      list.sort(byWeight);
      for (const chunk of partitionByWeight(list, s.minSize, s.maxSize, part.maxDiffKg)) {
        created.push(makeGrid(partId, part, chunk));
      }
    }
    state.grids = state.grids.filter((g) => g.partId !== partId).concat(sortGrids(state, locked.concat(created)));
    state.builtParts[partId] = true;
    distributeMats(state, partId, false);
    return state;
  }

  // ---------- Подписи весовой категории ----------

  function participantsMap(state) {
    const m = new Map();
    for (const p of state.participants) m.set(p.id, p);
    return m;
  }

  function gridWeights(state, grid, pm) {
    const map = pm || participantsMap(state);
    return grid.members.map((id) => map.get(id)).filter(Boolean).map((p) => p.weight);
  }

  function gridBase(state, grid, pm) {
    const part = getPart(state, grid.partId);
    const weights = gridWeights(state, grid, pm);
    if (!weights.length) return '';
    const max = Math.max.apply(null, weights);
    if (part && part.weightMode === 'fixed' && sortedLimits(part).length) {
      const l = fixedLimit(part, max);
      return l < 0 ? 'св. ' + -l : String(l);
    }
    return String(Math.ceil(max - 1e-9));
  }

  // Подписи для всех сеток части: «24», а если сеток с одинаковым числом несколько — «24а», «24б»…
  function gridLabels(state, partId) {
    const pm = participantsMap(state);
    const grids = gridsOfPart(state, partId);
    const buckets = new Map();
    for (const g of grids) {
      const base = gridBase(state, g, pm);
      const key = (g.format || '') + '|' + base;
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push({ g, base, avg: avg(gridWeights(state, g, pm)) });
    }
    const labels = {};
    for (const list of buckets.values()) {
      list.sort((a, b) => a.avg - b.avg || a.g.id.localeCompare(b.g.id));
      list.forEach((x, i) => {
        const auto = list.length > 1 ? x.base + (LETTERS[i] || String(i + 1)) : x.base;
        labels[x.g.id] = x.g.labelOverride ? x.g.labelOverride : auto;
      });
    }
    return labels;
  }

  function avg(arr) {
    return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
  }

  // ---------- Круги ----------

  // Круговая система методом «круга»: №1 стоит на месте, остальные вращаются.
  // Для 4 участников даёт ровно порядок с бланка: 1–2, 4–3 / 1–3, 2–4 / 1–4, 3–2.
  function roundRobin(n) {
    if (n < 2) return [];
    const BYE = 0;
    const rot = [];
    for (let i = 2; i <= n; i += 1) rot.push(i);
    if (n % 2 === 1) rot.push(BYE);
    const m = rot.length;
    const rounds = [];
    for (let r = 0; r < m; r += 1) {
      const pairs = [[1, rot[0]]];
      for (let k = 1; k <= (m - 1) / 2; k += 1) pairs.push([rot[m - k], rot[k]]);
      rounds.push(pairs.filter(([a, b]) => a !== BYE && b !== BYE));
      rot.push(rot.shift());
    }
    return rounds;
  }

  function bouts(n) {
    return (n * (n - 1)) / 2;
  }

  // ---------- Ковры ----------

  // Равномерно по числу схваток: крупные сетки первыми, каждую — на наименее загруженный ковёр.
  // Сетки, перенесённые вручную, остаются на своём ковре.
  function distributeMats(state, partId, keepManual) {
    const mats = Math.max(1, state.settings.mats | 0);
    const grids = gridsOfPart(state, partId);
    const load = new Array(mats + 1).fill(0);
    const free = [];
    for (const g of grids) {
      if (keepManual !== false && g.matManual && g.mat >= 1 && g.mat <= mats) load[g.mat] += bouts(g.members.length);
      else free.push(g);
    }
    free.sort((a, b) => b.members.length - a.members.length || a.id.localeCompare(b.id));
    for (const g of free) {
      let best = 1;
      for (let m = 2; m <= mats; m += 1) if (load[m] < load[best]) best = m;
      if (g.mat !== best && g.printedAt) g.dirtyAfterPrint = true;
      g.mat = best;
      g.matManual = false;
      load[best] += bouts(g.members.length);
    }
    return state;
  }

  function matLoads(state, partId) {
    const mats = Math.max(1, state.settings.mats | 0);
    const load = new Array(mats + 1).fill(0);
    for (const g of gridsOfPart(state, partId)) if (g.mat >= 1 && g.mat <= mats) load[g.mat] += bouts(g.members.length);
    return load.slice(1);
  }

  // ---------- Изменения после разбивки ----------

  function gridOfParticipant(state, pid) {
    return state.grids.find((g) => g.members.includes(pid)) || null;
  }

  function touch(grid) {
    if (grid.printedAt) grid.dirtyAfterPrint = true;
  }

  // Убрать участника из его сетки (снятие, удаление, смена данных). Возвращает id затронутой сетки.
  function detach(state, pid) {
    const g = gridOfParticipant(state, pid);
    if (!g) return null;
    g.members = g.members.filter((x) => x !== pid);
    touch(g);
    if (!g.members.length) state.grids = state.grids.filter((x) => x !== g);
    return g.id;
  }

  // Поставить участника в подходящую сетку его части, не трогая остальные.
  // Если подходящей сетки с местом нет — пересобираем только его группу (пол, уровень, категория).
  function placeIncremental(state, pid) {
    const p = state.participants.find((x) => x.id === pid);
    if (!p || p.withdrawn) return [];
    const partId = partOf(state, p);
    if (!partId || !state.builtParts[partId]) return [];
    const part = getPart(state, partId);
    const s = state.settings;
    const key = groupKey(part, p);
    const pm = participantsMap(state);
    const sameGroup = gridsOfPart(state, partId).filter((g) => {
      const first = pm.get(g.members[0]);
      return first && groupKey(part, first) === key;
    });
    let best = null;
    let bestRange = Number.POSITIVE_INFINITY;
    for (const g of sameGroup) {
      if (g.locked || g.members.length >= s.maxSize) continue;
      const ws = gridWeights(state, g, pm).concat(p.weight);
      const range = Math.max.apply(null, ws) - Math.min.apply(null, ws);
      if (range < bestRange) { bestRange = range; best = g; }
    }
    const tolerance = part.maxDiffKg || Math.max(2, typicalRange(state, sameGroup, pm) * 1.5);
    if (best && bestRange <= tolerance) {
      best.members.push(pid);
      touch(best);
      return [best.id];
    }
    return rebuildGroup(state, partId, key);
  }

  function typicalRange(state, grids, pm) {
    const ranges = grids.filter((g) => g.members.length > 1).map((g) => {
      const ws = gridWeights(state, g, pm);
      return Math.max.apply(null, ws) - Math.min.apply(null, ws);
    });
    return ranges.length ? avg(ranges) : 0;
  }

  // Пересобрать одну группу части; закреплённые сетки не трогаем. Ковры для новых сеток подбираются.
  function rebuildGroup(state, partId, key) {
    const part = getPart(state, partId);
    const s = state.settings;
    const pm = participantsMap(state);
    const old = gridsOfPart(state, partId).filter((g) => {
      const first = pm.get(g.members[0]);
      return !g.locked && first && groupKey(part, first) === key;
    });
    const lockedIds = new Set(gridsOfPart(state, partId).filter((g) => g.locked).flatMap((g) => g.members));
    const assigned = new Set(state.grids.flatMap((g) => g.members));
    const oldIds = new Set(old.flatMap((g) => g.members));
    const pool = activeOfPart(state, partId).filter((p) =>
      groupKey(part, p) === key && !lockedIds.has(p.id) && (oldIds.has(p.id) || !assigned.has(p.id)));
    const wasPrinted = old.some((g) => g.printedAt);
    const oldMats = old.map((g) => g.mat).filter(Boolean);
    state.grids = state.grids.filter((g) => !old.includes(g));
    const created = partitionByWeight(pool.sort(byWeight), s.minSize, s.maxSize, part.maxDiffKg)
      .map((chunk) => makeGrid(partId, part, chunk));
    const loads = matLoads(state, partId);
    created.forEach((g, i) => {
      if (oldMats[i]) g.mat = oldMats[i];
      else {
        let best = 0;
        for (let m = 1; m < loads.length; m += 1) if (loads[m] < loads[best]) best = m;
        g.mat = best + 1;
      }
      loads[g.mat - 1] += bouts(g.members.length);
      if (wasPrinted) { g.printedAt = 'перестроена'; g.dirtyAfterPrint = true; }
    });
    state.grids = state.grids.concat(created);
    return created.map((g) => g.id).concat(old.map((g) => g.id));
  }

  // ---------- Контроль целостности ----------

  function integrity(state) {
    const s = state.settings;
    const active = state.participants.filter((p) => !p.withdrawn);
    const count = new Map();
    for (const g of state.grids) for (const id of g.members) count.set(id, (count.get(id) || 0) + 1);
    const activeIds = new Set(active.map((p) => p.id));
    const noPart = active.filter((p) => !partOf(state, p));
    const unassigned = active.filter((p) => {
      const partId = partOf(state, p);
      return partId && state.builtParts[partId] && !count.has(p.id);
    });
    const notBuilt = active.filter((p) => {
      const partId = partOf(state, p);
      return partId && !state.builtParts[partId];
    });
    const duplicates = Array.from(count.entries()).filter(([, c]) => c > 1).map(([id]) => id);
    const ghosts = state.grids.flatMap((g) => g.members.filter((id) => !activeIds.has(id)));
    const small = state.grids.filter((g) => g.members.length < s.minSize);
    const big = state.grids.filter((g) => g.members.length > s.maxSize);
    const reprint = state.grids.filter((g) => g.dirtyAfterPrint);
    const notPrinted = state.grids.filter((g) => !g.printedAt);
    const inGrids = active.filter((p) => count.has(p.id)).length;
    // Участник в сетке «чужой» части — например, после смены годов рождения у частей.
    const pmap = participantsMap(state);
    const misplaced = state.grids.flatMap((g) => g.members.filter((id) => {
      const p = pmap.get(id);
      return p && !p.withdrawn && partOf(state, p) !== g.partId;
    }));
    const problems = noPart.length + unassigned.length + duplicates.length + ghosts.length + small.length + big.length + misplaced.length;
    return { total: active.length, inGrids, noPart, unassigned, notBuilt, duplicates, ghosts, small, big, reprint, notPrinted, misplaced, problems };
  }

  function findDuplicate(state, p) {
    const name = fullName(p).toLowerCase().replace(/ё/g, 'е');
    return state.participants.find((x) =>
      x.id !== p.id && x.birthDate === p.birthDate && fullName(x).toLowerCase().replace(/ё/g, 'е') === name) || null;
  }

  // ---------- Тестовые данные ----------

  // Детерминированный набор вымышленных участников, помеченных test: true.
  function testParticipants(state, perPart) {
    const boys = ['Миша', 'Артём', 'Иван', 'Лев', 'Матвей', 'Тимур', 'Егор', 'Марк', 'Даниил', 'Фёдор', 'Глеб', 'Савва'];
    const girls = ['Аня', 'Маша', 'Соня', 'Ева', 'Алиса', 'Вера', 'Полина', 'Варя'];
    const lasts = ['Тестов', 'Пробин', 'Образцов', 'Примеров', 'Демин', 'Учебнов', 'Макетов', 'Черновой'];
    const branches = ['Филиал 1', 'Филиал 2', 'Филиал 3'];
    const coaches = ['Тренер А', 'Тренер Б', 'Тренер В', 'Тренер Г'];
    let seed = 12345;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
    const out = [];
    const levels = state.settings.levels.length ? state.settings.levels : [''];
    for (const part of state.settings.parts) {
      const from = part.yearFrom || 2012;
      const to = part.yearTo || from;
      const lo = Math.min(from, to);
      const hi = Math.max(from, to);
      for (let i = 0; i < perPart; i += 1) {
        const year = lo + Math.floor(rnd() * (hi - lo + 1));
        const girl = rnd() < 0.2;
        const age = 2026 - year;
        const baseW = 10 + age * 2.8;
        const weight = Math.round((baseW + (rnd() - 0.5) * age * 1.4) * 10) / 10;
        const month = String(1 + Math.floor(rnd() * 12)).padStart(2, '0');
        const day = String(1 + Math.floor(rnd() * 28)).padStart(2, '0');
        const last = pick(lasts);
        out.push({
          id: uid('t'),
          lastName: girl ? last + 'а' : last,
          firstName: girl ? pick(girls) : pick(boys),
          birthDate: year + '-' + month + '-' + day,
          sex: girl ? 'Ж' : 'М',
          weight: Math.max(12, weight),
          level: pick(levels),
          branch: pick(branches),
          coach: pick(coaches),
          withdrawn: false,
          test: true,
          partId: part.yearFrom && part.yearTo ? '' : part.id,
          addedAt: new Date().toISOString(),
        });
      }
    }
    return out;
  }

  // Пробный турнир: заявка от филиалов (по perPart на часть), из неё «приехали» почти все,
  // несколько человек ещё ждём, несколько отмечены «не приехал». Всё помечено test: true.
  function testTournament(state, perPart) {
    const people = testParticipants(state, perPart || 55);
    const entries = [];
    const participants = [];
    people.forEach((p, i) => {
      const entry = { id: uid('e'), lastName: p.lastName, firstName: p.firstName, birthDate: p.birthDate, sex: p.sex, level: p.level, branch: p.branch, coach: p.coach, partId: p.partId, absent: false, test: true };
      entries.push(entry);
      if (i % 11 === 10) entry.absent = i % 22 === 21;
      else participants.push(Object.assign({}, p, { entryId: entry.id }));
    });
    return { entries, participants };
  }

  // ---------- Справочник клуба (база спортсменов) ----------

  function norm(s) {
    return String(s || '').trim().toLowerCase().replace(/ё/g, 'е');
  }

  function rosterKey(p) {
    return norm(p.lastName) + '|' + norm(p.firstName) + '|' + (p.birthDate || '');
  }

  // Поиск по началу фамилии (или «фамилия имя»), до limit вариантов.
  function rosterFind(state, query, limit) {
    const q = norm(query);
    if (!q) return [];
    return state.roster
      .filter((r) => norm(r.lastName + ' ' + r.firstName).startsWith(q) || norm(r.lastName).startsWith(q))
      .sort((a, b) => fullName(a).localeCompare(fullName(b), 'ru'))
      .slice(0, limit || 8);
  }

  // Добавить спортсмена в базу или обновить его данные (филиал, тренер, уровень, пол).
  function rosterUpsert(state, p) {
    const key = rosterKey(p);
    const fields = ['lastName', 'firstName', 'birthDate', 'sex', 'level', 'branch', 'coach'];
    let r = state.roster.find((x) => rosterKey(x) === key);
    if (!r) { r = { id: uid('r') }; state.roster.push(r); }
    for (const f of fields) if (p[f] != null && p[f] !== '') r[f] = p[f];
    return r;
  }

  function parseDate(text) {
    const t = String(text || '').trim();
    let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t);
    if (m) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
    m = /^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/.exec(t);
    if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
    return '';
  }

  // Список из Excel/таблицы: строки, колонки через Tab, «;» или «,».
  // Порядок колонок: Фамилия, Имя, Дата рождения, Пол, Уровень, Филиал, Тренер (последние можно не заполнять).
  function parseRosterText(text) {
    const items = [];
    const errors = [];
    String(text || '').split(/\r?\n/).forEach((line, i) => {
      if (!line.trim()) return;
      const sep = line.includes('\t') ? '\t' : line.includes(';') ? ';' : ',';
      const c = line.split(sep).map((x) => x.trim());
      if (i === 0 && norm(c[0]) === 'фамилия') return;
      const birthDate = parseDate(c[2]);
      if (!c[0] || !birthDate) { errors.push('Строка ' + (i + 1) + ': нужны фамилия и дата рождения (ДД.ММ.ГГГГ)'); return; }
      const sx = norm(c[3]);
      items.push({
        lastName: c[0], firstName: c[1] || '', birthDate,
        sex: sx.startsWith('ж') || sx.startsWith('д') || sx === 'f' ? 'Ж' : 'М',
        level: c[4] || '', branch: c[5] || '', coach: c[6] || '',
      });
    });
    return { items, errors };
  }

  // ---------- Заявка на турнир (списки от филиалов) ----------

  // Участник турнира, соответствующий строке заявки: по ссылке entryId или по ФИО + дате рождения.
  function entryParticipant(state, entry) {
    const key = rosterKey(entry);
    return state.participants.find((p) => p.entryId === entry.id) ||
      state.participants.find((p) => !p.entryId && rosterKey(p) === key) || null;
  }

  // Статус строки заявки: приехал (взвешен), не приехал (отмечено), ждём.
  function entryStatus(state, entry) {
    const p = entryParticipant(state, entry);
    if (p && !p.withdrawn) return 'arrived';
    if (entry.absent || (p && p.withdrawn)) return 'absent';
    return 'expected';
  }

  // Добавить в заявку; повтор (те же ФИО и дата рождения) обновляет строку.
  function entryUpsert(state, e) {
    const key = rosterKey(e);
    const fields = ['lastName', 'firstName', 'birthDate', 'sex', 'level', 'branch', 'coach', 'partId'];
    let r = state.entries.find((x) => rosterKey(x) === key);
    const isNew = !r;
    if (!r) { r = { id: uid('e'), absent: false }; state.entries.push(r); }
    for (const f of fields) if (e[f] != null && e[f] !== '') r[f] = e[f];
    return { entry: r, isNew };
  }

  function entrySummary(state) {
    const byBranch = new Map();
    const total = { expected: 0, arrived: 0, absent: 0, all: state.entries.length };
    for (const e of state.entries) {
      const st = entryStatus(state, e);
      total[st] += 1;
      const b = e.branch || 'Без филиала';
      if (!byBranch.has(b)) byBranch.set(b, { branch: b, expected: 0, arrived: 0, absent: 0, all: 0 });
      const row = byBranch.get(b);
      row[st] += 1;
      row.all += 1;
    }
    const keys = new Set(state.entries.map(rosterKey));
    const ids = new Set(state.entries.map((e) => e.id));
    const extra = state.participants.filter((p) => !p.withdrawn && !(p.entryId && ids.has(p.entryId)) && !keys.has(rosterKey(p))).length;
    return { total, extra, branches: Array.from(byBranch.values()).sort((a, b) => a.branch.localeCompare(b.branch, 'ru')) };
  }

  // Подсказки при взвешивании: сначала заявка этого турнира, потом справочник клуба.
  function suggest(state, query, limit) {
    const q = norm(query);
    if (!q) return [];
    const match = (r) => norm(r.lastName + ' ' + r.firstName).startsWith(q) || norm(r.lastName).startsWith(q);
    const seen = new Set();
    const out = [];
    const byName = (a, b) => fullName(a).localeCompare(fullName(b), 'ru');
    for (const e of state.entries.filter(match).sort(byName)) {
      seen.add(rosterKey(e));
      out.push({ item: e, source: 'entry', status: entryStatus(state, e) });
    }
    for (const r of state.roster.filter(match).sort(byName)) {
      if (seen.has(rosterKey(r))) continue;
      seen.add(rosterKey(r));
      const weighed = state.participants.some((p) => !p.withdrawn && rosterKey(p) === rosterKey(r));
      out.push({ item: r, source: 'roster', status: weighed ? 'arrived' : 'expected' });
    }
    return out.slice(0, limit || 8);
  }

  const GL = {
    SCHEMA_VERSION, uid, defaultState, migrate, migrateWithReport, clone,
    birthYear, formatRuDate, formatBirth, toRoman, fullName, partYearsLabel,
    partOf, getPart, activeOfPart, fixedLimit, sortedLimits, groupKey,
    partitionByWeight, buildPart, gridsOfPart, gridLabels, gridWeights, participantsMap,
    roundRobin, bouts, distributeMats, matLoads,
    gridOfParticipant, detach, placeIncremental, rebuildGroup,
    integrity, findDuplicate, testParticipants, testTournament,
    rosterFind, rosterUpsert, rosterKey, parseRosterText, parseDate,
    entryParticipant, entryStatus, entryUpsert, entrySummary, suggest,
  };
  globalThis.GL = GL;
})();

  const ui = { entryFilter: 'all', entrySearch: '', entryEdit: null, entryMsg: '', draftReset: false, draftMode: '', rosterEdit: null, rosterSearch: '', importMsg: '', prefill: null, tab: 'weigh', part: state.settings.parts[0] ? state.settings.parts[0].id : null, editId: null, search: '', printPart: null, printMat: 'all', printSel: null, formError: '' };

  function todayIso() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // Любое изменение — через commit: снимок для «Отменить», автосохранение, перерисовка.
  function commit(mutate, message) {
    const before = JSON.stringify(state);
    const next = GL.clone(state);
    const result = mutate(next);
    if (result === false) return;
    history.push(before);
    if (history.length > 40) history.shift();
    state = next;
    persist();
    render();
    if (message) toast(typeof message === 'function' ? message(result) : message);
  }

  function undo() {
    if (!history.length) return;
    state = GL.migrate(JSON.parse(history.pop()));
    persist();
    render();
    toast('Последнее действие отменено');
  }

  // ---------- Мелкие помощники ----------

  function h(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function plural(n, one, few, many) {
    const a = Math.abs(n) % 100;
    const b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }
  function pm() { return GL.participantsMap(state); }
  function partName(id) {
    const p = GL.getPart(state, id);
    return p ? p.name : 'без части';
  }
  function gridNumber(grid) {
    return GL.gridsOfPart(state, grid.partId).indexOf(grid) + 1;
  }

  let toastTimer = null;
  function toast(text) {
    let el = document.querySelector('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = text;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 3500);
  }

  // Своё окно подтверждения: системные confirm/alert в некоторых окнах не показываются.
  function ask(opts) {
    closeModal();
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><h3>' + h(opts.title) + '</h3>' +
      (opts.html || '<p>' + h(opts.text || '') + '</p>') +
      '<div class="row">' + (opts.cancel === false ? '' : '<button class="btn" data-m="no">' + h(opts.cancel || 'Отмена') + '</button>') +
      (opts.ok ? '<button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" data-m="yes">' + h(opts.ok) + '</button>' : '') + '</div></div>';
    back.addEventListener('click', (e) => {
      const b = e.target.closest('[data-m]');
      if (e.target === back || (b && b.dataset.m === 'no')) { closeModal(); if (opts.onCancel) opts.onCancel(); }
      if (b && b.dataset.m === 'yes') { closeModal(); opts.onOk(); }
    });
    document.body.appendChild(back);
    const yes = back.querySelector('[data-m="yes"]') || back.querySelector('[data-m="no"]');
    if (yes) yes.focus();
    if (opts.onOpen) opts.onOpen(back);
  }
  function closeModal() {
    document.querySelectorAll('.modal-back').forEach((x) => x.remove());
  }

  // Если правка трогает уже напечатанные сетки — сначала спросить.
  function commitWithPrintCheck(mutate, message) {
    const trial = GL.clone(state);
    const affected = mutate(trial) || [];
    const printed = state.grids.filter((g) => affected.includes(g.id) && g.printedAt);
    if (!printed.length) { commit(mutate, message); return; }
    const labels = GL.gridLabels(state, printed[0].partId);
    ask({
      title: 'Изменится напечатанная шахматка',
      text: 'Затронуты уже напечатанные сетки: ' + printed.map((g) => '№' + gridNumber(g) + ' (' + (labels[g.id] || '') + ' кг)').join(', ') +
        '. Если судьи уже начали — согласуйте с ними. Шахматки будут отмечены «нужно перепечатать».',
      ok: 'Изменить',
      onOk: () => commit(mutate, message),
    });
  }

  // ---------- Шапка ----------

  function renderTop(info) {
    const tabs = [
      ['setup', 'Турнир'],
      ['entries', 'Заявка', state.entries.length],
      ['weigh', 'Взвешивание', info.total],
      ['grids', 'Сетки', state.grids.length],
      ['mats', 'Ковры'],
      ['print', 'Печать', info.reprint.length ? '↻' + info.reprint.length : ''],
      ['roster', 'Справочник', state.roster.length],
    ];
    const hasTest = state.participants.some((p) => p.test) || state.roster.some((r) => r.test) || state.entries.some((e) => e.test);
    return (hasTest ? '<div class="banner"><div class="wrap"><b>Тестовые данные</b><span class="banner-text">В турнире есть вымышленные участники для пробы.</span><button class="btn small" data-act="remove-test">Удалить тестовых</button></div></div>' : '') +
      (!storageOk ? '<div class="banner"><div class="wrap">Автосохранение в этом браузере недоступно — сохраняйте турнир в файл.</div></div>' : '') +
      '<header class="top"><div class="wrap">' +
      '<div class="brand"><img class="logo" src="' + LOGO + '" alt="Эмблема клуба «Гладиатор»" width="40" height="40"><span>Гладиатор: шахматки <span class="demo-tag">Демо-версия</span><br><small>' + h(GL.formatRuDate(state.settings.date)) + '</small></span></div>' +
      '<div class="chips">' +
      '<span class="chip">Взвешено: <b>' + info.total + '</b></span>' +
      '<span class="chip ' + (info.inGrids === info.total && info.total ? 'ok' : '') + '">В сетках: <b>' + info.inGrids + '</b></span>' +
      (info.notBuilt.length ? '<button class="chip warn" data-go="grids">Ждут разбивки: <b>' + info.notBuilt.length + '</b></button>' : '') +
      (info.problems ? '<button class="chip bad" data-go="grids">Проблем: <b>' + info.problems + '</b></button>' : (info.total ? '<span class="chip ok">Никто не потерян</span>' : '')) +
      (info.reprint.length ? '<button class="chip warn" data-go="print">Перепечатать: <b>' + info.reprint.length + '</b></button>' : '') +
      '</div>' +
      '<div class="actions">' +
      '<button class="btn" data-act="undo" ' + (history.length ? '' : 'disabled') + ' title="Ctrl+Z">Отменить</button>' +
      '<button class="btn" data-act="save-file">Сохранить в файл</button>' +
      '<button class="btn" data-act="open-file">Открыть файл</button>' +
      '</div></div>' +
      '<div class="wrap"><nav class="tabs" aria-label="Разделы">' +
      tabs.map(([id, name, n]) => '<button data-tab="' + id + '" ' + (ui.tab === id ? 'aria-current="page"' : '') + '>' + name + (n ? '<span class="n">' + n + '</span>' : '') + '</button>').join('') +
      '</nav></div></header>';
  }

  // ---------- Турнир (настройки) ----------

  function renderSetup() {
    const s = state.settings;
    const fmtOptions = (cur) => s.formats.map((f) => '<option ' + (f === cur ? 'selected' : '') + '>' + h(f) + '</option>').join('');
    const rows = s.parts.map((p, i) => {
      const count = GL.activeOfPart(state, p.id).length;
      return '<tr>' +
        '<td><input id="pn-' + p.id + '" data-part="' + p.id + '" data-field="name" value="' + h(p.name) + '" aria-label="Название части"></td>' +
        '<td><input id="pf-' + p.id + '" class="y" type="number" data-part="' + p.id + '" data-field="yearFrom" value="' + h(p.yearFrom || '') + '" placeholder="—" aria-label="Год рождения с"></td>' +
        '<td><input id="pt-' + p.id + '" class="y" type="number" data-part="' + p.id + '" data-field="yearTo" value="' + h(p.yearTo || '') + '" placeholder="—" aria-label="Год рождения по"></td>' +
        '<td><select id="pfo-' + p.id + '" data-part="' + p.id + '" data-field="format" aria-label="Формат борьбы">' + fmtOptions(p.format) + '</select></td>' +
        '<td><select id="pm-' + p.id + '" data-part="' + p.id + '" data-field="weightMode" aria-label="Весовые категории"><option value="float" ' + (p.weightMode !== 'fixed' ? 'selected' : '') + '>плавающие</option><option value="fixed" ' + (p.weightMode === 'fixed' ? 'selected' : '') + '>фиксированные</option></select></td>' +
        '<td><input id="pl-' + p.id + '" data-part="' + p.id + '" data-field="limits" value="' + h((p.limits || []).join(', ')) + '" placeholder="24, 26, 28" ' + (p.weightMode === 'fixed' ? '' : 'disabled') + ' aria-label="Границы категорий"></td>' +
        '<td><input id="pd-' + p.id + '" class="kg" type="number" step="0.5" min="0" data-part="' + p.id + '" data-field="maxDiffKg" value="' + h(p.maxDiffKg || '') + '" placeholder="авто" aria-label="Допустимая разница в весе"></td>' +
        '<td class="num">' + count + '</td>' +
        '<td><button class="btn small danger" data-act="del-part" data-id="' + p.id + '" ' + (s.parts.length < 2 ? 'disabled' : '') + ' aria-label="Удалить часть ' + (i + 1) + '">×</button></td></tr>';
    }).join('');
    return '<section class="panel"><h2>Турнир</h2>' +
      '<div class="row">' +
      '<label class="f" style="flex:3 1 320px"><span>Заголовок бланка</span><input id="s-title" data-set="title" value="' + h(s.title) + '"></label>' +
      '<label class="f"><span>Дата</span><input id="s-date" type="date" data-set="date" value="' + h(s.date) + '"></label>' +
      '<label class="f"><span>Ковров</span><input id="s-mats" type="number" min="1" max="10" data-set="mats" value="' + s.mats + '" style="width:80px"></label>' +
      '<div class="f"><span>Человек в сетке</span><div class="range"><label for="s-min">от</label><input id="s-min" type="number" min="2" max="8" data-set="minSize" value="' + s.minSize + '"><label for="s-max">до</label><input id="s-max" type="number" min="2" max="8" data-set="maxSize" value="' + s.maxSize + '"></div></div>' +
      '</div></section>' +
      '<section class="panel"><div class="row"><h2>Части турнира</h2><span class="spacer"></span><button class="btn" data-act="add-part">Добавить часть</button></div>' +
      '<details class="help"><summary>Как работают части и весовые категории</summary><p>Участник попадает в часть по году рождения. Если у части годы не заданы (например, «выборочно»), участников в неё ставят вручную при взвешивании. «Плавающие» категории — сетки собираются из ближайших по весу; на бланке пишется вес самого тяжёлого, округлённый вверх. «Фиксированные» — по границам «до 24, до 26…»; переполненная категория делится на подгруппы а, б, в. Пустая «разница в весе» — подбирается автоматически. Форматы борьбы и уровни меняются на вкладке «Справочник».</p></details>' +
      '<div class="table-wrap"><table class="list parts-table"><thead><tr><th>Название</th><th>Г. р. с</th><th>по</th><th>Формат борьбы</th><th>Вес</th><th>Границы, кг</th><th>Разница, кг</th><th>Чел.</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div></section>' +
      '<section class="panel"><h2>Проба и сброс</h2><p class="hint">Тестовый турнир — вымышленная заявка (по 55 человек на часть), из которой почти все «приехали». Всё помечено «тест». Его удобно использовать, чтобы показать приложение и потренироваться; перед настоящим турниром удалите их.</p>' +
      '<div class="row"><button class="btn" data-act="add-test">Добавить тестовый турнир</button>' +
      '<button class="btn" data-act="remove-test">Удалить тестовых</button><span class="spacer"></span>' +
      '<button class="btn danger" data-act="reset">Начать новый турнир</button></div></section>';

  // ---------- Заявка на турнир ----------

  const ENTRY_STATUS = { arrived: 'приехал', expected: 'ждём', absent: 'не приехал' };

    const list = withStatus

      .sort((a, b) => (a.e.branch || '').localeCompare(b.e.branch || '', 'ru') || GL.fullName(a.e).localeCompare(GL.fullName(b.e), 'ru'));
    const shown = list.slice(0, 400);

      const p = st === 'arrived' ? GL.entryParticipant(state, e) : null;

        '<td>' + h(e.level || '') + '</td><td>' + h(e.branch || '') + '</td><td>' + h(e.coach || '') + '</td>' +
        '<td>' + (partId ? h(partName(partId)) : '<span class="hint">—</span>') + '</td>' +
        '<td><span class="pill ' + st + '">' + ENTRY_STATUS[st] + (p ? ' · ' + Number(p.weight).toFixed(1) + ' кг' : '') + '</span></td>' +

        (st === 'expected' ? '<button class="btn small" data-act="entry-absent" data-id="' + e.id + '">Не приехал</button>' : '') +

      '<details class="help"><summary>По филиалам</summary><div class="table-wrap"><table class="list"><thead><tr><th>Филиал</th><th>Заявлено</th><th>Приехали</th><th>Ждём</th><th>Не приехали</th></tr></thead><tbody>' + branchRows + '</tbody></table></div></details></section>' : '';

      summary +
      '<section class="panel"><details class="help"' + (state.entries.length && !ui.entryMsg ? '' : ' open') + '><summary>Загрузить список филиала из Excel</summary>' +
      '<p>Скопируйте из Excel строки с колонками: <b>Фамилия, Имя, Дата рождения, Пол, Уровень, Филиал, Тренер</b> и вставьте сюда. Дата — в виде 04.03.2021. Если филиала нет в строках, укажите его в поле ниже — он подставится всем. Повторная загрузка того же спортсмена обновит строку, а не создаст копию.</p>' +
      '<div class="row"><label class="f" style="flex:1 1 220px"><span>Филиал для всего списка (если в строках не указан)</span><input id="entry-branch" list="dl-ebranch" placeholder="например, Филиал 2"></label></div>' +
      '<textarea id="entry-text" rows="5" placeholder="Панков&#9;Мирон&#9;04.03.2021&#9;М&#9;Новичок&#9;Филиал 1&#9;Иванов"></textarea>' +
      '<div class="row"><button class="btn primary" data-act="entry-import">Добавить в заявку</button></div>' +
      (ui.entryMsg ? '<div class="notice ' + (ui.entryMsg.startsWith('Ошибки') ? 'warn' : 'ok') + '">' + ui.entryMsg + '</div>' : '') +
      '</details>' +
      '<details class="help"' + (editing ? ' open' : '') + '><summary>' + (editing ? 'Изменить строку заявки' : 'Добавить одного спортсмена в заявку') + '</summary>' +
      '<form id="entry-form" class="weigh-form" autocomplete="off" novalidate>' +
      '<label class="f"><span>Фамилия</span><input id="e-last" name="lastName" value="' + h(v.lastName) + '" required></label>' +
      '<label class="f"><span>Имя</span><input id="e-first" name="firstName" value="' + h(v.firstName) + '"></label>' +
      '<label class="f"><span>Дата рождения</span><input id="e-birth" name="birthDate" type="date" min="2000-01-01" max="2030-12-31" value="' + h(v.birthDate) + '" required></label>' +
      '<label class="f"><span>Пол</span><select id="e-sex" name="sex"><option value="М" ' + (v.sex !== 'Ж' ? 'selected' : '') + '>мальчик</option><option value="Ж" ' + (v.sex === 'Ж' ? 'selected' : '') + '>девочка</option></select></label>' +

      '<datalist id="dl-ebranch">' + knownValues('branch').map((b) => '<option value="' + h(b) + '">').join('') + '</datalist>' +
      '<datalist id="dl-ecoach">' + knownValues('coach').map((b) => '<option value="' + h(b) + '">').join('') + '</datalist>' +
      '</section>' +
      '<section class="panel"><div class="row"><div class="subtabs">' + filterBtn('all', 'Все', sum.total.all) + filterBtn('expected', 'Ждём', sum.total.expected) + filterBtn('arrived', 'Приехали', sum.total.arrived) + filterBtn('absent', 'Не приехали', sum.total.absent) + '</div><span class="spacer"></span>' +
      '<input id="entry-search" type="search" placeholder="Поиск по фамилии, филиалу, тренеру" value="' + h(ui.entrySearch) + '" style="min-width:min(280px,100%)"></div>' +
      (state.entries.length ? (list.length ? '<div class="table-wrap"><table class="list"><thead><tr><th>ФИО</th><th>Д. р.</th><th>Пол</th><th>Уровень</th><th>Филиал</th><th>Тренер</th><th>Часть</th><th>Статус</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        (list.length > shown.length ? '<p class="hint">Показаны первые ' + shown.length + ' из ' + list.length + ' — уточните поиск.</p>' : '') : '<div class="empty">Никого не нашли.</div>')
        : '<div class="empty">Заявка пуста. Вставьте списки от филиалов из Excel выше. Можно работать и без заявки — просто взвешивайте всех подряд.</div>') +
      (state.entries.length ? '<div class="row"><span class="spacer"></span><button class="btn small danger" data-act="entry-clear">Очистить заявку</button></div>' : '') +
      '</section>';
  }

  function readPerson(form) {
    const fd = new FormData(form);
    return {
      lastName: String(fd.get('lastName') || '').trim(),
      firstName: String(fd.get('firstName') || '').trim(),
      birthDate: String(fd.get('birthDate') || ''),
      sex: fd.get('sex') === 'Ж' ? 'Ж' : 'М',
      level: String(fd.get('level') || ''),
      branch: String(fd.get('branch') || '').trim(),
      coach: String(fd.get('coach') || '').trim(),
    };
  }

  function submitEntry(form) {
    const data = readPerson(form);
    if (!data.lastName || !/^\d{4}-\d{2}-\d{2}$/.test(data.birthDate)) { toast('Нужны фамилия и дата рождения'); return; }
    const editId = ui.entryEdit;
    ui.entryEdit = null;
    ui.draftReset = true;
    commit((st) => {
      const e = editId ? st.entries.find((x) => x.id === editId) : null;
      if (e) Object.assign(e, data); else GL.entryUpsert(st, data);
      GL.rosterUpsert(st, data);
    }, editId ? 'Сохранено' : 'Добавлен в заявку');
    focusLater('e-last');
  }

  function importEntries() {
    const el = document.getElementById('entry-text');
    const br = document.getElementById('entry-branch');
    const branch = br ? br.value.trim() : '';
    const { items, errors } = GL.parseRosterText(el ? el.value : '');
    if (!items.length && !errors.length) { toast('Вставьте строки из Excel'); return; }
    let added = 0;
    commit((st) => {
      items.forEach((x) => {
        if (!x.branch && branch) x.branch = branch;
        if (GL.entryUpsert(st, x).isNew) added += 1;
        GL.rosterUpsert(st, x);
      });
    });
    ui.entryMsg = (errors.length ? 'Ошибки: ' + h(errors.slice(0, 5).join('; ')) + (errors.length > 5 ? '…' : '') + '. ' : '') +
      'В заявку добавлено: ' + added + ', обновлено: ' + (items.length - added) + '.';
    render();
  }

    return '<section class="panel"><div class="row"><div><h2>Справочник клуба</h2><p class="hint">Спортсмены клуба хранятся здесь между турнирами. При взвешивании начните вводить фамилию — дата рождения, пол, уровень, филиал и тренер подставятся, а часть турнира подберётся по году рождения. Каждый взвешенный участник автоматически добавляется или обновляется здесь.</p></div></div></section>' +
      '<section class="panel"><h2>' + (editing ? 'Изменить спортсмена' : 'Добавить спортсмена') + '</h2>' +
      '<form id="roster-form" class="weigh-form" autocomplete="off" novalidate>' +
      '<label class="f"><span>Фамилия</span><input id="r-last" name="lastName" value="' + h(v.lastName) + '" required></label>' +

      '<label class="f"><span>Пол</span><select id="r-sex" name="sex"><option value="М" ' + (v.sex !== 'Ж' ? 'selected' : '') + '>мальчик</option><option value="Ж" ' + (v.sex === 'Ж' ? 'selected' : '') + '>девочка</option></select></label>' +

  function submitRoster(form) {
    const fd = new FormData(form);
    const data = {
      lastName: String(fd.get('lastName') || '').trim(),
      firstName: String(fd.get('firstName') || '').trim(),
      birthDate: String(fd.get('birthDate') || ''),
      sex: fd.get('sex') === 'Ж' ? 'Ж' : 'М',
      level: String(fd.get('level') || ''),
      branch: String(fd.get('branch') || '').trim(),
      coach: String(fd.get('coach') || '').trim(),
    };
    if (!data.lastName || !/^\d{4}-\d{2}-\d{2}$/.test(data.birthDate)) { toast('Нужны фамилия и дата рождения'); return; }
    const editId = ui.rosterEdit;
    ui.rosterEdit = null;
    ui.draftReset = true;
    commit((st) => {
      if (editId) { const r = st.roster.find((x) => x.id === editId); if (r) Object.assign(r, data); else GL.rosterUpsert(st, data); }
      else GL.rosterUpsert(st, data);
    }, editId ? 'Сохранено' : 'Добавлен в справочник');
    setTimeout(() => { const el = document.getElementById('r-last'); if (el) el.focus(); }, 0);
  }

  function importRoster() {
    const el = document.getElementById('import-text');
    const { items, errors } = GL.parseRosterText(el ? el.value : '');
    if (!items.length && !errors.length) { toast('Вставьте строки из Excel'); return; }
    const before = state.roster.length;
    commit((st) => { items.forEach((x) => GL.rosterUpsert(st, x)); });
    const added = state.roster.length - before;
    ui.importMsg = (errors.length ? 'Ошибки: ' + h(errors.slice(0, 5).join('; ')) + (errors.length > 5 ? '…' : '') + '. ' : '') +
      'Новых: ' + added + ', обновлено: ' + (items.length - added) + '.';
    render();
  }
